services:
  mongodb:
    build: ./mongodb
    image: joindevops/mongodb:v1
    container_name: mongodb
  redis:
    image: redis:7
    container_name: redis
  mysql:
    build: ./mysql
    image: joindevops/mysql:v1
    container_name: mysql
  catalogue:
    build: ./catalogue
    image: joindevops/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: joindevops/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
    environment:
      MONGO: true
      REDIS_URL: "redis://redis:6379"
      MONGO_URL: "mongodb://mongodb:27017/users"
  cart:
    build: ./cart
    image: joindevops/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
    environment:
      CATALOGUE_HOST: catalogue
      REDIS_HOST: "redis"
      CATALOGUE_PORT: 8080
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  frontend:
    image: joindevops/frontend:v1
    build: ./frontend
    ports:
    - "80:80"
    container_name: frontend
    depends_on:
    - catalogue
    - user
    - cart
networks:
  default:
    driver: bridge
    name: roboshop
    external: false # if true, you need to create network manually